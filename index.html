<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ФАЄРВОЛ — воксельний шутер</title>
    <style>
      /* PixCyrillic (SIL OFL 1.1) — свободная лицензия и полная украинская
         кириллика; в нём есть даже стрелки ↑↓←→, которых у прежнего шрифта
         не было и которые молча падали на системный моноширинный */
      @font-face {
        font-family: 'PixCyrillic';
        src: url('./PixCyrillic.ttf') format('truetype');
        font-display: block;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #0d0605;
        color: #e8dcd4;
        font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      /* Игра занимает всю страницу: своей заставки у неё нет, титул с меню
         нарисован внутри самой игры */
      .mg-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #0d0605;
        touch-action: none;
        user-select: none;
        overflow: hidden;
      }
      .mg-overlay canvas {
        display: block;
        image-rendering: pixelated;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
